name: 'My Olivero Subtheme'
type: theme
description: 'A custom subtheme based on Olivero for Drupal 10+'
package: Custom
core_version_requirement: ^10
base theme: olivero  # Key: Declares Olivero as parent (no underscore).

# Inherit Olivero's regions (or add/customize as needed).
regions:
  header: Header
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  hero: Hero (full width)
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: Social Bar
  content_above: Content Above
  content: Content
  sidebar: Sidebar
  content_below: Content Below
  footer_top: Footer Top


# Optional: Define custom libraries (e.g., for your CSS/JS overrides).
libraries:
  - my_olivero/global-styling
